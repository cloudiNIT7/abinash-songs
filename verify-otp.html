<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no, viewport-fit=cover" />
		<link rel="stylesheet" href="./css/main.css?v=20260906f" />
		<link rel="stylesheet" href="./css/fonts.css?v=20260906f" />
		<link rel="stylesheet" href="./css/responsive.css?v=20260906f" />
		<title>Verify your email - Cloud Songs</title>
		<link rel="icon" href="./assets/favicon.png?v=20260906f" />
		<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
		<style>
			:root { --sp-green:#1DB954; --sp-green-h:#1ed760; }
			.otp_wrap { min-height:100vh; background:#121212; display:flex; align-items:center; justify-content:center; padding:40px 15px; box-sizing:border-box; }
			.otp_card { background:#000; width:100%; max-width:440px; margin:0 auto; padding:40px 32px 32px; border-radius:8px; box-sizing:border-box; text-align:center; }
			.otp_logo { display:flex; justify-content:center; margin-bottom:26px; }
			.otp_logo svg { width:120px; fill:#fff; }
			.otp_logo .app-brand__icon { height:54px; }
			.otp_logo .app-brand__text { font-size:22px; }
			.otp_card h1 { color:#fff; font-size:26px; font-weight:700; margin:0 0 10px; }
			.otp_sub { color:#b3b3b3; font-size:14px; line-height:1.5; margin:0 0 6px; }
			/* Delivery hint: these codes land in spam often enough that people
			   assume the mail never arrived. */
			.otp_spam {
				display:flex; align-items:flex-start; gap:8px; text-align:left;
				background:rgba(242,201,76,.10); border:1px solid rgba(242,201,76,.32);
				border-radius:10px; padding:10px 12px; margin:14px 0 0;
				color:#e3d9b8; font-size:12.5px; line-height:1.5;
			}
			.otp_spam svg { width:16px; height:16px; flex:none; margin-top:1px; fill:#f2c94c; }
			.otp_email { color:#fff; font-weight:700; word-break:break-all; }
			.otp_inputs { display:flex; justify-content:center; gap:10px; margin:28px 0 6px; }
			.otp_inputs input {
				width:48px; height:56px; text-align:center; font-size:24px; font-weight:700;
				color:#fff; background:#121212; border:1px solid #727272; border-radius:8px; outline:none;
				transition:border-color .15s, box-shadow .15s;
			}
			.otp_inputs input:focus { border-color:var(--sp-green); box-shadow:0 0 0 2px rgba(29,185,84,.3); }
			.otp_error { color:#f15e6c; font-size:13px; min-height:16px; margin:10px 0 0; }
			.otp_ok { color:var(--sp-green); font-size:13px; min-height:16px; margin:10px 0 0; }
			.otp_submit {
				width:100%; border:none; border-radius:50px; padding:14px 0; margin-top:22px;
				background:var(--sp-green); color:#000; font-weight:700; font-size:15px; letter-spacing:1px;
				text-transform:uppercase; cursor:pointer; transition:transform .15s, background .15s;
			}
			.otp_submit:hover { background:var(--sp-green-h); transform:scale(1.02); }
			.otp_submit:disabled { opacity:.6; cursor:default; transform:none; }
			.otp_resend { color:#b3b3b3; font-size:13px; margin-top:20px; }
			.otp_resend button { background:none; border:none; color:#fff; font-weight:700; cursor:pointer; text-decoration:underline; font-size:13px; }
			.otp_resend button:disabled { color:#727272; cursor:default; text-decoration:none; }
			.otp_back { display:block; margin-top:22px; color:#b3b3b3; font-size:13px; }
			.otp_back:hover { color:#fff; text-decoration:underline; }
		
			.otp_demo {
				margin: 4px 0 10px; padding: 9px 12px; border-radius: 8px;
				background: rgba(29,185,84,.12); border: 1px solid rgba(29,185,84,.35);
				color: #1ed760; font-size: 13px; text-align: center;
			}
			.otp_demo:empty { display: none; }
		</style>
	</head>
	<body>
		<div class="otp_wrap">
			<div class="otp_card">
				<div class="otp_logo">
					<span class="app-brand"><img class="app-brand__icon" src="./assets/logo.png?v=20260906f" alt="" /><span class="app-brand__text">Cloud Songs</span></span>
				</div>

				<h1>Verify your email</h1>
				<p class="otp_sub">We sent a 6-digit code to</p>
				<p class="otp_sub otp_email" id="otpEmail">your email</p>

				<p class="otp_spam">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4.4-8 5-8-5V6l8 5 8-5v2.4z"/></svg>
					<span>Can&rsquo;t find the email? Check your <strong>spam</strong> or junk folder &mdash; codes often land there. Marking it &ldquo;not spam&rdquo; helps future codes arrive normally.</span>
				</p>

				<form id="otpForm">
					<div class="otp_inputs" id="otpInputs">
						<input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" />
						<input type="text" inputmode="numeric" maxlength="1" />
						<input type="text" inputmode="numeric" maxlength="1" />
						<input type="text" inputmode="numeric" maxlength="1" />
						<input type="text" inputmode="numeric" maxlength="1" />
						<input type="text" inputmode="numeric" maxlength="1" />
					</div>
					<div class="otp_error" id="otpError"></div>
					<div class="otp_demo" id="otpDemo"></div>
					<button type="submit" class="otp_submit" id="otpSubmit">Verify</button>
				</form>

				<p class="otp_resend">
					Didn't get it? <button type="button" id="otpResend">Resend code</button>
					<span id="otpResendTimer"></span>
				</p>
				<a href="./login.html" class="otp_back">&larr; Back to login</a>
			</div>
		</div>

		<script src="./js/auth.js?v=20260906f"></script>
		<script>
			var params = new URLSearchParams(window.location.search);
			var email = params.get("email") || "";
			document.getElementById("otpEmail").textContent = email || "your email";
			if (!email) { window.location.href = "./login.html"; }

			var inputs = Array.prototype.slice.call(document.querySelectorAll("#otpInputs input"));
			var form = document.getElementById("otpForm");
			var submitBtn = document.getElementById("otpSubmit");
			var errorEl = document.getElementById("otpError");
			var resendBtn = document.getElementById("otpResend");
			var resendTimer = document.getElementById("otpResendTimer");

			inputs[0].focus();

			function code() { return inputs.map(function (i) { return i.value; }).join(""); }

			inputs.forEach(function (inp, idx) {
				inp.addEventListener("input", function () {
					inp.value = inp.value.replace(/\D/g, "").slice(0, 1);
					if (inp.value && idx < inputs.length - 1) inputs[idx + 1].focus();
					errorEl.textContent = "";
				});
				inp.addEventListener("keydown", function (e) {
					if (e.key === "Backspace" && !inp.value && idx > 0) inputs[idx - 1].focus();
				});
				inp.addEventListener("paste", function (e) {
					e.preventDefault();
					var text = (e.clipboardData || window.clipboardData).getData("text").replace(/\D/g, "").slice(0, 6);
					for (var k = 0; k < text.length && k < inputs.length; k++) inputs[k].value = text[k];
					(inputs[Math.min(text.length, inputs.length - 1)]).focus();
				});
			});

			form.addEventListener("submit", async function (e) {
				e.preventDefault();
				var c = code();
				if (c.length !== 6) { errorEl.textContent = "Enter the 6-digit code."; return; }
				submitBtn.disabled = true; submitBtn.textContent = "Verifying...";
				var result = await verifyOtp(email, c);
				submitBtn.disabled = false; submitBtn.textContent = "Verify";
				if (!result.ok) { errorEl.textContent = result.message; return; }
				// Verified + logged in. New accounts go to profile setup.
				if (!result.user || !result.user.profile_completed) {
					window.location.href = "./profile.html";
				} else {
					window.location.href = "./Spotify-songs/songs.html";
				}
			});

			var cooldown = 0, timerId = null;
			function startCooldown(secs) {
				cooldown = secs; resendBtn.disabled = true;
				resendTimer.textContent = " (" + cooldown + "s)";
				timerId = setInterval(function () {
					cooldown--;
					if (cooldown <= 0) { clearInterval(timerId); resendBtn.disabled = false; resendTimer.textContent = ""; }
					else resendTimer.textContent = " (" + cooldown + "s)";
				}, 1000);
			}

			resendBtn.addEventListener("click", async function () {
				resendBtn.disabled = true;
				var result = await resendOtp(email);
				errorEl.style.color = result.ok ? "#1DB954" : "#f15e6c";
				errorEl.textContent = result.ok
					? (result.message || "A new code was sent.") + " Remember to check your spam folder."
					: (result.message || "Couldn't resend.");
				if (result.ok) startCooldown(30); else resendBtn.disabled = false;
			});
		</script>
	</body>
</html>
