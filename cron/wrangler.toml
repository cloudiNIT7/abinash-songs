# Standalone Worker whose only job is the cron trigger for listening
# suggestions. It is deliberately in its own directory: a wrangler.toml at the
# repo root would become the source of truth for the *Pages* project and drop
# the DB / SESSION_SECRET / CACHE bindings configured in the dashboard.
#
# Deploy:
#   cd cron
#   npx wrangler secret put CRON_SECRET     # same value as on the Pages project
#   npx wrangler deploy
name = "cloud-songs-cron"
main = "src/index.js"
compatibility_date = "2026-09-01"

[triggers]
# Hourly. The endpoint applies quiet hours, a four-a-day cap and a four-hour
# minimum gap, so this only decides how often we *check* - checking hourly is
# what lets those four land at roughly 09:00 / 13:00 / 17:00 / 21:00 local
# rather than bunching up early.
crons = ["0 * * * *"]

[vars]
SITE_ORIGIN = "https://abinash-songs.pages.dev"
