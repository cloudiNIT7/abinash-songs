<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no, viewport-fit=cover" />
		<link rel="stylesheet" href="./css/main.css?v=20260906e" />
		<link rel="stylesheet" href="./css/fonts.css?v=20260906e" />
		<link rel="stylesheet" href="./css/responsive.css?v=20260906e" />
		<title>Set up your profile - Cloud Songs</title>
		<link rel="icon" href="./assets/favicon.png?v=20260906e" />
		<link
			href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			/* ---- Profile page (advanced) ----
			 * Ambient gradient stage + glass card. Class names and ids are kept
			 * identical to the original markup so the page script is untouched. */
			:root {
				--pf-green: #1DB954;
				--pf-green-h: #1ed760;
				--pf-ink: #ffffff;
				--pf-muted: #a7a7a7;
				--pf-danger: #f15e6c;
				--pf-card: rgba(24, 24, 27, .82);
				--pf-stroke: rgba(255, 255, 255, .10);
				--pf-field: rgba(255, 255, 255, .04);
				--pf-radius: 20px;
			}

			.setup_wrap {
				position: relative;
				min-height: 100vh;
				min-height: 100dvh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: clamp(20px, 5vw, 56px) 16px;
				box-sizing: border-box;
				background:
					radial-gradient(58rem 32rem at 12% -8%, rgba(29, 185, 84, .20), transparent 60%),
					radial-gradient(48rem 30rem at 92% 8%, rgba(91, 95, 243, .18), transparent 62%),
					radial-gradient(42rem 28rem at 50% 112%, rgba(155, 81, 224, .14), transparent 60%),
					#0a0a0b;
				overflow: hidden;
			}
			/* Soft moving sheen behind the card. */
			.setup_wrap::before {
				content: "";
				position: absolute;
				inset: -30%;
				background: conic-gradient(from 210deg, transparent 0 35%, rgba(29, 185, 84, .10) 45%, transparent 60% 100%);
				filter: blur(60px);
				animation: pf-drift 26s linear infinite;
				pointer-events: none;
			}
			@keyframes pf-drift { to { transform: rotate(1turn); } }

			.setup_card {
				position: relative;
				width: 100%;
				max-width: 520px;
				margin: 0 auto;
				padding: clamp(26px, 5vw, 40px) clamp(20px, 5vw, 38px) clamp(24px, 4vw, 34px);
				border-radius: var(--pf-radius);
				box-sizing: border-box;
				background: var(--pf-card);
				border: 1px solid var(--pf-stroke);
				-webkit-backdrop-filter: blur(22px) saturate(140%);
				backdrop-filter: blur(22px) saturate(140%);
				box-shadow:
					0 1px 0 rgba(255, 255, 255, .06) inset,
					0 30px 70px -20px rgba(0, 0, 0, .85);
				animation: pf-rise .5s cubic-bezier(.2, .7, .3, 1) both;
			}
			@keyframes pf-rise {
				from { opacity: 0; transform: translateY(14px) scale(.985); }
				to   { opacity: 1; transform: none; }
			}
			/* Hairline gradient top edge. */
			.setup_card::after {
				content: "";
				position: absolute;
				left: 14%; right: 14%; top: 0;
				height: 1px;
				background: linear-gradient(90deg, transparent, rgba(29, 185, 84, .8), transparent);
			}

			.setup_logo {
				display: flex;
				justify-content: center;
				margin-bottom: 18px;
			}
			.setup_logo svg { width: 110px; fill: var(--pf-ink); }
			.setup_logo .app-brand__icon { height: 46px; }
			.setup_logo .app-brand__text { font-size: 21px; letter-spacing: -.2px; }

			.setup_card h1 {
				color: var(--pf-ink);
				text-align: center;
				font-size: clamp(22px, 4.4vw, 28px);
				font-weight: 800;
				letter-spacing: -.5px;
				margin: 0 0 8px;
			}
			.setup_sub {
				color: var(--pf-muted);
				text-align: center;
				font-size: 14px;
				margin: 0 0 26px;
				line-height: 1.55;
			}

			/* ---- avatar ---- */
			.setup_avatar_row {
				display: flex;
				align-items: center;
				gap: 20px;
				padding: 16px;
				margin-bottom: 22px;
				border-radius: 16px;
				background: var(--pf-field);
				border: 1px solid var(--pf-stroke);
			}
			.setup_avatar_preview {
				position: relative;
				width: 84px;
				height: 84px;
				border-radius: 50%;
				display: flex;
				align-items: center;
				justify-content: center;
				color: #fff;
				font-size: 32px;
				font-weight: 800;
				flex-shrink: 0;
				cursor: pointer;
				overflow: hidden;
				background-size: cover;
				background-position: center;
				box-shadow: 0 0 0 2px rgba(255, 255, 255, .14), 0 10px 24px -10px rgba(0, 0, 0, .9);
				transition: background-color .2s ease, box-shadow .2s ease, transform .2s ease;
			}
			.setup_avatar_preview:hover { transform: translateY(-1px); box-shadow: 0 0 0 2px var(--pf-green), 0 14px 28px -12px rgba(0, 0, 0, .9); }
			.setup_avatar_preview:focus-visible { outline: 3px solid var(--pf-green-h); outline-offset: 3px; }
			.setup_avatar_edit {
				position: absolute; inset: 0;
				display: flex; align-items: center; justify-content: center;
				background: rgba(0, 0, 0, .5); color: #fff; opacity: 0;
				transition: opacity .18s ease;
			}
			.setup_avatar_edit svg { width: 26px; height: 26px; }
			.setup_avatar_preview:hover .setup_avatar_edit,
			.setup_avatar_preview:focus-visible .setup_avatar_edit { opacity: 1; }

			.setup_avatar_side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
			.setup_upload_btn {
				align-self: flex-start;
				background: rgba(255, 255, 255, .10);
				color: #fff;
				border: 1px solid rgba(255, 255, 255, .22);
				border-radius: 999px;
				padding: 8px 18px;
				font-size: 13px;
				font-weight: 700;
				font-family: inherit;
				cursor: pointer;
				transition: background .16s ease, border-color .16s ease, transform .16s ease;
			}
			.setup_upload_btn:hover { background: rgba(255, 255, 255, .18); border-color: var(--pf-green); transform: translateY(-1px); }
			.setup_upload_btn:active { transform: none; }
			.setup_upload_btn:focus-visible { outline: 3px solid var(--pf-green-h); outline-offset: 2px; }

			.setup_swatches { display: flex; flex-wrap: wrap; gap: 9px; }
			.setup_swatch {
				position: relative;
				width: 26px;
				height: 26px;
				border-radius: 50%;
				border: 2px solid transparent;
				cursor: pointer;
				padding: 0;
				transition: transform .15s ease, box-shadow .15s ease;
			}
			.setup_swatch:hover { transform: scale(1.14); }
			.setup_swatch:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
			.setup_swatch.active {
				border-color: #fff;
				box-shadow: 0 0 0 3px rgba(255, 255, 255, .18);
			}
			/* Checkmark on the selected colour, for non-colour cues too. */
			.setup_swatch.active::after {
				content: "";
				position: absolute;
				left: 50%; top: 46%;
				width: 5px; height: 9px;
				border: 2px solid #fff;
				border-top: 0; border-left: 0;
				transform: translate(-50%, -50%) rotate(45deg);
			}

			/* ---- fields ---- */
			.setup_field { margin-bottom: 18px; }
			.setup_field label {
				display: block;
				color: var(--pf-ink);
				font-size: 13px;
				font-weight: 700;
				letter-spacing: .2px;
				margin-bottom: 8px;
			}
			.setup_field input,
			.setup_field textarea {
				width: 100%;
				box-sizing: border-box;
				padding: 13px 15px;
				border-radius: 12px;
				border: 1px solid rgba(255, 255, 255, .16);
				background: var(--pf-field);
				color: var(--pf-ink);
				font-size: 15px;
				font-family: inherit;
				line-height: 1.45;
				resize: vertical;
				transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
			}
			.setup_field input::placeholder,
			.setup_field textarea::placeholder { color: rgba(255, 255, 255, .38); }
			.setup_field input:hover,
			.setup_field textarea:hover { border-color: rgba(255, 255, 255, .28); }
			.setup_field input:focus,
			.setup_field textarea:focus {
				outline: none;
				border-color: var(--pf-green);
				background: rgba(255, 255, 255, .06);
				box-shadow: 0 0 0 4px rgba(29, 185, 84, .18);
			}

			.setup_hint {
				color: var(--pf-muted);
				font-size: 12px;
				margin-top: 7px;
				text-align: right;
				font-variant-numeric: tabular-nums;
			}
			.setup_error {
				color: var(--pf-danger);
				font-size: 13px;
				margin: -4px 0 14px;
				min-height: 18px;
				line-height: 1.4;
			}
			.setup_error:not(:empty) {
				padding: 9px 12px;
				border-radius: 10px;
				background: rgba(241, 94, 108, .12);
				border: 1px solid rgba(241, 94, 108, .32);
				margin-bottom: 16px;
			}

			/* ---- submit ---- */
			.setup_submit {
				width: 100%;
				border: none;
				border-radius: 999px;
				padding: 15px 0;
				background: linear-gradient(180deg, var(--pf-green-h), var(--pf-green));
				color: #06240f;
				font-weight: 800;
				font-size: 15px;
				letter-spacing: .8px;
				text-transform: uppercase;
				font-family: inherit;
				cursor: pointer;
				box-shadow: 0 12px 26px -12px rgba(29, 185, 84, .8);
				transition: filter .18s ease, transform .18s ease, box-shadow .18s ease;
			}
			.setup_submit:hover { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 16px 30px -12px rgba(29, 185, 84, .9); }
			.setup_submit:active { transform: none; }
			.setup_submit:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
			.setup_submit:disabled {
				opacity: .55;
				cursor: default;
				filter: none;
				transform: none;
				box-shadow: none;
			}

			/* ---- responsive ---- */
			@media (max-width: 480px) {
				.setup_card { border-radius: 16px; }
				.setup_avatar_row { gap: 14px; padding: 14px; }
				.setup_avatar_preview { width: 68px; height: 68px; font-size: 26px; }
				.setup_swatch { width: 24px; height: 24px; }
			}

			/* Respect users who prefer less motion. */
			@media (prefers-reduced-motion: reduce) {
				.setup_wrap::before { animation: none; }
				.setup_card { animation: none; }
				.setup_avatar_preview,
				.setup_upload_btn,
				.setup_swatch,
				.setup_submit { transition: none; }
			}
		</style>
	</head>
	<body>
		<div class="setup_wrap">
			<div class="setup_card">
				<div class="setup_logo">
					<span class="app-brand"><img class="app-brand__icon" src="./assets/logo.png?v=20260906e" alt="" /><span class="app-brand__text">Cloud Songs</span></span>
				</div>

				<h1>Set up your profile</h1>
				<p class="setup_sub">Just a couple of things so people (and you) can tell your account apart from everyone else's.</p>

				<form id="setupForm">
					<div class="setup_avatar_row">
						<div class="setup_avatar_preview" id="avatarPreview" title="Upload a photo" role="button" tabindex="0" aria-label="Upload a profile photo"><span id="avatarInitial">A</span>
							<div class="setup_avatar_edit">
								<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 3 7.17 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.17L15 3H9zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>
							</div>
						</div>
						<div class="setup_avatar_side">
							<button type="button" class="setup_upload_btn" id="uploadPhotoBtn">Upload photo</button>
							<div class="setup_swatches" id="swatches"></div>
						</div>
					</div>
					<input type="file" id="avatarFile" accept="image/*" hidden />

					<div class="setup_field">
						<label for="displayName">Display name</label>
						<input type="text" id="displayName" name="displayName" placeholder="How should we show your name?" required maxlength="60" />
					</div>

					<div class="setup_field">
						<label for="bio">Short bio <span style="font-weight:400; color: var(--secondary);">(optional)</span></label>
						<textarea id="bio" name="bio" rows="3" maxlength="280" placeholder="Tell us a little about yourself"></textarea>
						<div class="setup_hint" id="bioCount">0 / 280</div>
					</div>

					<div class="setup_error" id="setupError"></div>
					<button type="submit" class="setup_submit" id="setupSubmit">Save & Continue</button>
				</form>
			</div>
		</div>

		<script src="./js/auth.js?v=20260906e"></script>
		<script type="module">
			// This page is required after signup/first login — no auth, no page.
			// The session lives on the server, so wait for it before deciding.
			await authReady();
			if (!isLoggedIn()) {
				window.location.replace("./login.html");
				throw new Error("not signed in");
			}

			const currentUser = getCurrentUserObj();
			const AVATAR_COLORS = ["#1DB954", "#F15E6C", "#5B5FF3", "#F2C94C", "#9B51E0", "#2D9CDB", "#EB5757", "#27AE60"];

			const displayNameInput = document.getElementById("displayName");
			const bioInput = document.getElementById("bio");
			const bioCount = document.getElementById("bioCount");
			const avatarPreview = document.getElementById("avatarPreview");
			const avatarInitial = document.getElementById("avatarInitial");
			const avatarFile = document.getElementById("avatarFile");
			const uploadPhotoBtn = document.getElementById("uploadPhotoBtn");
			const swatchesEl = document.getElementById("swatches");
			const setupForm = document.getElementById("setupForm");
			const setupError = document.getElementById("setupError");
			const setupSubmit = document.getElementById("setupSubmit");

			let selectedColor = (currentUser && currentUser.avatar_color) || AVATAR_COLORS[0];
			let photoUrl = (currentUser && currentUser.avatar_url) || "";

			// Pre-fill with whatever we already know about the account.
			displayNameInput.value = (currentUser && currentUser.display_name) || (currentUser && currentUser.username) || "";
			bioInput.value = (currentUser && currentUser.bio) || "";
			bioCount.textContent = `${bioInput.value.length} / 280`;

			function renderAvatar() {
				const initial = (displayNameInput.value.trim()[0] || (currentUser && currentUser.username[0]) || "?").toUpperCase();
				avatarInitial.textContent = initial;
				if (photoUrl) {
					avatarPreview.style.backgroundImage = "url('" + photoUrl + "')";
					avatarPreview.style.backgroundColor = "transparent";
					avatarInitial.style.display = "none";
				} else {
					avatarPreview.style.backgroundImage = "none";
					avatarPreview.style.backgroundColor = selectedColor;
					avatarInitial.style.display = "";
				}
			}

			// Upload + resize a personal photo, save it to the account.
			function pickPhoto() { avatarFile.click(); }
			if (avatarPreview) avatarPreview.addEventListener("click", pickPhoto);
			// Keyboard support: the preview is a role="button", so Enter/Space act like a click.
			if (avatarPreview) avatarPreview.addEventListener("keydown", function (e) {
				if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") { e.preventDefault(); pickPhoto(); }
			});
			if (uploadPhotoBtn) uploadPhotoBtn.addEventListener("click", pickPhoto);
			if (avatarFile) avatarFile.addEventListener("change", function () {
				const file = avatarFile.files && avatarFile.files[0];
				avatarFile.value = "";
				if (!file) return;
				const reader = new FileReader();
				reader.onload = function () {
					const img = new Image();
					img.onload = async function () {
						const size = 256, canvas = document.createElement("canvas");
						canvas.width = canvas.height = size;
						const ctx = canvas.getContext("2d");
						const side = Math.min(img.width, img.height);
						ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
						const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
						setupError.textContent = "";
						const res = (typeof setAvatar === "function") ? await setAvatar(dataUrl) : { ok: false, message: "Upload unavailable." };
						if (res.ok) { photoUrl = dataUrl; renderAvatar(); }
						else { setupError.textContent = res.message || "Couldn't save the photo."; }
					};
					img.src = reader.result;
				};
				reader.readAsDataURL(file);
			});

			function renderSwatches() {
				swatchesEl.innerHTML = "";
				AVATAR_COLORS.forEach((color) => {
					const btn = document.createElement("button");
					btn.type = "button";
					btn.className = "setup_swatch" + (color === selectedColor ? " active" : "");
					btn.style.backgroundColor = color;
					btn.setAttribute("aria-label", "Choose avatar color " + color);
					btn.addEventListener("click", () => {
						selectedColor = color;
						// Choosing a colour replaces any uploaded photo.
						if (photoUrl) { photoUrl = ""; if (typeof setAvatar === "function") setAvatar(""); }
						renderSwatches();
						renderAvatar();
					});
					swatchesEl.appendChild(btn);
				});
			}

			displayNameInput.addEventListener("input", renderAvatar);
			bioInput.addEventListener("input", () => {
				bioCount.textContent = `${bioInput.value.length} / 280`;
			});

			renderSwatches();
			renderAvatar();

			setupForm.addEventListener("submit", async (e) => {
				e.preventDefault();
				const displayName = displayNameInput.value.trim();
				if (!displayName) {
					setupError.textContent = "Please enter a display name.";
					return;
				}

				setupSubmit.disabled = true;
				setupSubmit.textContent = "Saving...";

				const result = await updateProfile(displayName, selectedColor, bioInput.value.trim());

				setupSubmit.disabled = false;
				setupSubmit.textContent = "Save & Continue";

				if (!result.ok) {
					setupError.textContent = result.message;
					return;
				}

				const params = new URLSearchParams(window.location.search);
				const nextUrl = params.get("next") || "./Spotify-songs/songs.html";

				if (result.offline) {
					// Saved locally only — let them know, then continue anyway.
					setupError.style.color = "#F2C94C";
					setupError.textContent = result.message;
					setTimeout(() => { window.location.replace(nextUrl); }, 1600);
					return;
				}

				window.location.replace(nextUrl);
			});
		</script>
	</body>
</html>
