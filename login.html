<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no, viewport-fit=cover" />
		<link rel="stylesheet" href="./css/main.css?v=20260906e" />
		<link rel="stylesheet" href="./css/fonts.css?v=20260906e" />
		<link rel="stylesheet" href="./css/responsive.css?v=20260906e" />
		<title>Login - Cloud Songs</title>
		<link rel="icon" href="./assets/favicon.png?v=20260906e" />
		<link
			href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			.login_wrap {
				min-height: 100vh;
				background: #121212;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 40px 15px;
				box-sizing: border-box;
			}
			.login_logo {
				display: flex;
				justify-content: center;
				margin-bottom: 32px;
			}
			.login_logo svg {
				width: 130px;
				fill: var(--white);
			}
			.login_logo .app-brand__icon { height: 60px; }
			.login_logo .app-brand__text { font-size: 24px; }
			.login_card {
				background: #000;
				width: 100%;
				max-width: 420px;
				margin: 0 auto;
				padding: 40px 32px 32px;
				border-radius: 8px;
				box-sizing: border-box;
			}
			.login_card h1 {
				color: var(--white);
				text-align: center;
				font-size: 28px;
				font-weight: 700;
				margin: 0 0 28px;
			}
			.login_tabs {
				display: flex;
				margin-bottom: 24px;
				border-bottom: 1px solid #292929;
			}
			.login_tab {
				flex: 1;
				text-align: center;
				padding: 12px 0;
				color: var(--secondary);
				font-weight: 700;
				font-size: 14px;
				cursor: pointer;
				border-bottom: 2px solid transparent;
				background: none;
				border-top: none;
				border-left: none;
				border-right: none;
			}
			.login_tab.active {
				color: var(--white);
				border-bottom: 2px solid var(--linkgreen);
			}
			.login_field {
				margin-bottom: 18px;
			}
			.login_field label {
				display: block;
				color: var(--white);
				font-size: 13px;
				font-weight: 700;
				margin-bottom: 8px;
			}
			.login_field input {
				width: 100%;
				box-sizing: border-box;
				padding: 12px 14px;
				border-radius: 4px;
				border: 1px solid #727272;
				background: #121212;
				color: var(--white);
				font-size: 15px;
			}
			.login_field input:focus {
				outline: none;
				border-color: var(--white);
			}
			.login_error {
				color: #f15e6c;
				font-size: 13px;
				margin: -6px 0 16px;
				min-height: 16px;
			}
			/* Neutral counterpart to .login_error: explains why the user is here
			   (for example after being signed out from another device). */
			.login_notice {
				color: #d6d6d6;
				background: rgba(29, 185, 84, .12);
				border: 1px solid rgba(29, 185, 84, .35);
				border-radius: 10px;
				padding: 10px 12px;
				font-size: 13px;
				line-height: 1.45;
				margin: 0 0 16px;
			}
			.login_notice[hidden] { display: none; }
			/* Waiting for another device to approve this sign-in. */
			.login_wait[hidden] { display: none; }
			.login_wait { text-align: center; }
			.login_wait h2 { font-size: 22px; margin: 14px 0 8px; }
			.login_wait p { color: #b3b3b3; font-size: 14px; line-height: 1.55; margin: 0 0 10px; }
			.login_wait__device { color: #fff !important; font-weight: 700; }
			.login_wait__timer { color: #8a8a8a !important; font-size: 13px !important; font-variant-numeric: tabular-nums; }
			.login_wait__spin {
				width: 46px; height: 46px; margin: 4px auto 0;
				border: 3px solid rgba(255, 255, 255, .18);
				border-top-color: #1DB954; border-radius: 50%;
				animation: loginSpin 1s linear infinite;
			}
			@keyframes loginSpin { to { transform: rotate(360deg); } }
			@media (prefers-reduced-motion: reduce) { .login_wait__spin { animation-duration: 3s; } }
			.login_wait__ghost {
				width: 100%; margin-top: 10px; background: none; border: none;
				color: #b3b3b3; font-size: 13px; font-family: inherit; cursor: pointer; text-decoration: underline;
			}
			.login_wait__ghost:hover { color: #fff; }
			.login_submit {
				width: 100%;
				border: none;
				border-radius: 50px;
				padding: 14px 0;
				background-color: #1DB954;
				color: var(--white);
				font-weight: 700;
				font-size: 15px;
				letter-spacing: 1px;
				text-transform: uppercase;
				cursor: pointer;
				transition-duration: .3s;
			}
			.login_submit:hover {
				background-color: var(--hvrgreen);
			}
			.login_hint {
				color: var(--secondary);
				font-size: 12px;
				text-align: center;
				margin-top: 20px;
				line-height: 1.5;
			}
			.login_back {
				display: block;
				text-align: center;
				margin-top: 24px;
				color: var(--secondary);
				font-size: 13px;
			}
			.login_back:hover {
				color: var(--white);
				text-decoration: underline;
			}
			.login_forgot {
				text-align: center;
				margin: 18px 0 0;
			}
			.login_forgot a {
				color: var(--white);
				font-size: 13px;
				font-weight: 700;
				text-decoration: underline;
			}
			.login_forgot a:hover { color: #1DB954; }
		</style>
	</head>
	<body>
		<div class="login_wrap">
			<div class="login_card">
				<div class="login_logo">
					<a href="./index.html">
						<span class="app-brand"><img class="app-brand__icon" src="./assets/logo.png?v=20260906e" alt="" /><span class="app-brand__text">Cloud Songs</span></span>
					</a>
				</div>

				<div class="login_tabs">
					<button type="button" class="login_tab active" id="tabLogin">Log In</button>
					<button type="button" class="login_tab" id="tabSignup">Sign Up</button>
				</div>

				<h1 id="formTitle">Log in to Cloud Songs</h1>

				<p class="login_notice" id="authNotice" role="status" hidden></p>

				<form id="authForm">
					<div class="login_field" id="usernameField">
						<label for="username">Username</label>
						<input type="text" id="username" name="username" autocomplete="username" placeholder="Enter your username" />
					</div>
					<div class="login_field">
						<label for="email">Email</label>
						<input type="email" id="email" name="email" autocomplete="email" placeholder="Enter your email" required />
					</div>
					<div class="login_field">
						<label for="password">Password</label>
						<input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required />
					</div>
					<div class="login_error" id="authError"></div>
					<button type="submit" class="login_submit" id="authSubmit">Log In</button>
				</form>

				<p class="login_forgot" id="forgotWrap">
					<a href="./reset-password.html" id="forgotLink">Forgot your password?</a>
				</p>

				<!-- Shown instead of the form while a device that is already
				     signed in decides whether to let this one in. -->
				<div class="login_wait" id="loginWait" hidden>
					<div class="login_wait__spin"></div>
					<h2>Approve this sign-in</h2>
					<p>
						This account is already signed in on another device. Open Cloud Songs
						there &mdash; it has a request waiting, as a pop-up and in its
						notifications.
					</p>
					<p class="login_wait__device" id="waitDevice"></p>
					<p class="login_wait__timer" id="waitTimer"></p>
					<div class="login_error" id="waitError"></div>
					<button type="button" class="login_submit" id="waitCode">Email me a code instead</button>
					<button type="button" class="login_wait__ghost" id="waitCancel">Cancel</button>
				</div>

				<a href="./index.html" class="login_back">&larr; Back to home</a>
			</div>
		</div>

		<script src="./js/auth.js?v=20260906e"></script>
		<script>
			const tabLogin = document.getElementById("tabLogin");
			const tabSignup = document.getElementById("tabSignup");
			const formTitle = document.getElementById("formTitle");
			const authSubmit = document.getElementById("authSubmit");
			const authForm = document.getElementById("authForm");
			const authError = document.getElementById("authError");
			const authNotice = document.getElementById("authNotice");

			// Arriving here because the session ended (signed out from the
			// Devices list on another device, "sign out all other devices", or a
			// password change) - say so instead of looking like a random logout.
			if (/[?&]signedout=1/.test(location.search)) {
				authNotice.textContent = "You were signed out. This can happen when the session is ended from another device or the password changes. Log in to continue.";
				authNotice.hidden = false;
			}
			const passwordInput = document.getElementById("password");
			const usernameField = document.getElementById("usernameField");
			const usernameInput = document.getElementById("username");

			let mode = "login"; // or "signup"

			function setMode(newMode) {
				mode = newMode;
				authError.textContent = "";
				if (mode === "login") {
					tabLogin.classList.add("active");
					tabSignup.classList.remove("active");
					formTitle.textContent = "Log in to Cloud Songs";
					authSubmit.textContent = "Log In";
					passwordInput.setAttribute("autocomplete", "current-password");
					usernameField.style.display = "none";
					usernameInput.required = false;
				} else {
					tabSignup.classList.add("active");
					tabLogin.classList.remove("active");
					formTitle.textContent = "Create your account";
					authSubmit.textContent = "Sign Up";
					passwordInput.setAttribute("autocomplete", "new-password");
					usernameField.style.display = "";
					usernameInput.required = true;
				}
				// "Forgot password" only makes sense when logging in.
				var forgotWrap = document.getElementById("forgotWrap");
				if (forgotWrap) forgotWrap.style.display = mode === "login" ? "" : "none";
			}

			setMode("login");
			tabLogin.addEventListener("click", () => setMode("login"));
			tabSignup.addEventListener("click", () => setMode("signup"));

			// Carry whatever email is typed over to the reset page.
			var forgotLink = document.getElementById("forgotLink");
			if (forgotLink) forgotLink.addEventListener("click", function () {
				var e = document.getElementById("email").value.trim();
				forgotLink.href = "./reset-password.html" + (e ? "?email=" + encodeURIComponent(e) : "");
			});

			// If already logged in, skip straight past the form.
			authReady().then(() => {
				if (isLoggedIn()) {
					window.location.replace(isProfileComplete() ? "./Spotify-songs/songs.html" : "./profile.html");
				}
			});

			authForm.addEventListener("submit", async (e) => {
				e.preventDefault();
				const username = usernameInput.value.trim();
				const email = document.getElementById("email").value.trim();
				const password = document.getElementById("password").value;

				if (!email || !password || (mode === "signup" && !username)) {
					authError.textContent = "Please fill in all fields.";
					return;
				}

				authSubmit.disabled = true;
				authSubmit.textContent = mode === "login" ? "Logging in..." : "Signing up...";

				const result = mode === "login"
					? await logIn(email, password)
					: await signUp(username, email, password);

				authSubmit.disabled = false;
				authSubmit.textContent = mode === "login" ? "Log In" : "Sign Up";

				if (result.requiresOtp) {
					window.location.replace("./verify-otp.html?email=" + encodeURIComponent(result.email || email));
					return;
				}

				// Already signed in elsewhere: wait for that device to answer.
				if (result.requiresApproval) {
					startApprovalWait(result, email);
					return;
				}

				if (!result.ok) {
					authError.textContent = result.message;
					// No account for this email: guide them to Sign Up, keeping
					// what they typed so they can just add a name and continue.
					if (mode === "login" && result.noAccount) {
						setMode("signup");
						authError.textContent = "No account found for this email. Please create an account first.";
						document.getElementById("email").value = email;
						document.getElementById("password").value = password;
						usernameInput.focus();
					}
					return;
				}

				// First-time (or not-yet-completed) accounts go through the
				// one-time profile setup screen before reaching the app.
				if (!result.user || !result.user.profile_completed) {
					window.location.replace("./profile.html");
				} else {
					window.location.replace("./Spotify-songs/songs.html");
				}
			});

			/* ---- waiting on another device to approve this sign-in ----------
			 * The password was right, but the account is already signed in
			 * somewhere, so that device decides. We poll for its answer and, if
			 * it says yes, exchange the approval for a session here. */
			const loginWait = document.getElementById("loginWait");
			const waitDevice = document.getElementById("waitDevice");
			const waitTimer = document.getElementById("waitTimer");
			const waitError = document.getElementById("waitError");
			const waitCode = document.getElementById("waitCode");
			const waitCancel = document.getElementById("waitCancel");
			const tabsWrap = document.querySelector(".login_tabs");
			const forgotWrap = document.getElementById("forgotWrap");

			let waitPoll = null;
			let waitTick = null;
			let waitEmail = "";

			function showWaitScreen(on) {
				loginWait.hidden = !on;
				authForm.hidden = on;
				if (tabsWrap) tabsWrap.hidden = on;
				if (forgotWrap) forgotWrap.hidden = on;
				formTitle.hidden = on;
				authNotice.hidden = on || !authNotice.textContent;
			}

			function stopWaiting() {
				if (waitPoll) { clearInterval(waitPoll); waitPoll = null; }
				if (waitTick) { clearInterval(waitTick); waitTick = null; }
			}

			function backToForm(message) {
				stopWaiting();
				showWaitScreen(false);
				waitError.textContent = "";
				authError.textContent = message || "";
				document.getElementById("password").value = "";
			}

			function startApprovalWait(result, email) {
				waitEmail = result.email || email;
				waitError.textContent = "";
				waitDevice.textContent = result.device ? "Request sent for " + result.device : "";
				showWaitScreen(true);

				let left = result.expiresIn || 300;
				const renderTimer = () => {
					const m = Math.floor(left / 60), s = left % 60;
					waitTimer.textContent = left > 0
						? "Waiting for approval \u2014 expires in " + m + ":" + (s < 10 ? "0" : "") + s
						: "This request has expired.";
				};
				renderTimer();
				waitTick = setInterval(() => { left = Math.max(0, left - 1); renderTimer(); }, 1000);

				// Poll briskly: this is the gap the person on this device sits
				// through after the other one taps Approve.
				const pollOnce = async () => {
					const status = await checkLoginApproval(result.approvalId);
					if (!status.ok) return;                     // transient: keep waiting

					if (status.status === "approved") {
						stopWaiting();
						waitTimer.textContent = "Approved. Signing you in\u2026";
						const claim = await claimLoginApproval(result.approvalId);
						if (!claim.ok) { backToForm(claim.message || "Couldn't complete that sign-in."); return; }
						window.location.replace(claim.user && claim.user.profile_completed
							? "./Spotify-songs/songs.html" : "./profile.html");
						return;
					}
					if (status.status === "denied") {
						stopWaiting();
						waitTimer.textContent = "";
						waitError.textContent = "That device denied this sign-in. If it wasn't you, change your password.";
						return;
					}
					if (status.status === "expired" || status.status === "unknown") {
						stopWaiting();
						waitTimer.textContent = "";
						waitError.textContent = "The request expired without an answer. Try again, or use an email code.";
					}
				};
				waitPoll = setInterval(pollOnce, 1000);
				pollOnce();
			}

			// Escape hatch: no device answered (or none is reachable), so fall
			// back to proving the email instead.
			waitCode.addEventListener("click", async () => {
				waitCode.disabled = true;
				waitCode.textContent = "Sending\u2026";
				const sent = await resendOtp(waitEmail, "login");
				waitCode.disabled = false;
				waitCode.textContent = "Email me a code instead";
				if (!sent.ok) { waitError.textContent = sent.message || "Couldn't send that code."; return; }
				stopWaiting();
				window.location.replace("./verify-otp.html?email=" + encodeURIComponent(waitEmail));
			});

			waitCancel.addEventListener("click", () => backToForm(""));
		</script>
	</body>
</html>
